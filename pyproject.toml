[project]
name = "speakquest"
version = "0.1.0"
description = "SpeakQuest speech-coaching backend: analysis worker, API handlers and grounded coaching."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Signal processing used by the analysis worker (Lambda container image).
worker = [
  "numpy>=2.0,<3",
  "scipy>=1.13",
  "praat-parselmouth>=0.4.5",
]
# AWS SDK. Present in the Lambda runtime already; needed locally and in the worker image.
aws = [
  "boto3>=1.35",
]
# Local word-timestamp aligner used when Amazon Transcribe is unavailable.
asr = [
  "faster-whisper>=1.1",
]
# Synthetic fixture generation for the evaluation dataset.
fixtures = [
  "piper-tts>=1.2",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "moto[s3,dynamodb,stepfunctions]>=5.0",
  "types-PyYAML",
  "boto3-stubs[s3,dynamodb,stepfunctions,transcribe,bedrock-runtime]",
]

[project.scripts]
speakquest-analyze = "speakquest.cli:main"
speakquest-local = "speakquest_api.local.server:main"
speakquest-eval = "speakquest_eval.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "services/worker/speakquest",
  "services/api/speakquest_api",
  "services/explain/speakquest_explain",
  "eval/speakquest_eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: exercises real audio through ffmpeg/parselmouth (seconds, not ms)",
  "asr: requires the local faster-whisper model",
  "live_aws: calls real AWS services; opt in with SPEAKQUEST_LIVE_AWS=1",
]
filterwarnings = [
  "ignore::DeprecationWarning:botocore.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/worker", "services/api", "services/explain", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
  "PLR0913",  # analysis functions legitimately take many measurements
  "PLR2004",  # rubric constants are named in YAML, literals in tests are fine
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802", "PLC0415"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["services/worker", "services/api", "services/explain", "eval"]
packages = ["speakquest", "speakquest_api", "speakquest_explain", "speakquest_eval"]
explicit_package_bases = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["parselmouth.*", "scipy.*", "faster_whisper.*", "piper.*", "moto.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["speakquest", "speakquest_api", "speakquest_explain", "speakquest_eval"]
